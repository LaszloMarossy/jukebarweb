<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
  <title>JukeBar</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #1a1a1a;
      --card:    #1e1e1e;
      --card2:   #252525;
      --accent:  #fda185;
      --accent2: #e8723a;
      --text:    #f0ece8;
      --muted:   #888;
      --border:  #2d2d2d;
      --error:   #f87171;
    }

    html, body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      min-height: 100dvh; -webkit-font-smoothing: antialiased; overscroll-behavior: none;
    }
    button { cursor: pointer; border: none; background: none; color: inherit; font: inherit; }
    input  { font: inherit; color: inherit; background: none; border: none; outline: none; }

    /* ── screens ── */
    .screen { display: none; min-height: 100dvh; flex-direction: column; }
    .screen.active { display: flex; }

    /* spinner */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 44px; height: 44px; border: 4px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite;
    }

    /* ══════════════════════════════════════════════════════════════
       LOADING SCREEN
    ══════════════════════════════════════════════════════════════ */
    #s-loading { align-items: center; justify-content: center; gap: 20px; }
    .load-logo { margin-bottom: 8px; }
    .load-text  { color: var(--muted); font-size: 14px; }

    /* ══════════════════════════════════════════════════════════════
       ERROR SCREEN
    ══════════════════════════════════════════════════════════════ */
    #s-error { align-items: center; justify-content: center; padding: 40px 32px; text-align: center; gap: 16px; }
    .err-icon  { font-size: 52px; }
    .err-title { font-size: 20px; font-weight: 700; }
    .err-msg   { color: var(--muted); font-size: 15px; line-height: 1.6; }

    /* ══════════════════════════════════════════════════════════════
       PLAY SCREEN (landing)
    ══════════════════════════════════════════════════════════════ */
    #s-play { min-height: 100dvh; }

    .play-header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 16px 0;
    }
    .play-logo { flex-shrink: 0; display: flex; }
    .info-btn {
      flex-shrink: 0; width: clamp(20px, 3dvh, 28px); height: clamp(20px, 3dvh, 28px);
      border-radius: 50%; background: #f5c842; color: #111; border: none;
      font-size: clamp(11px, 1.6dvh, 14px); font-style: italic; font-weight: 700;
      display: flex; align-items: center; justify-content: center; margin-left: auto;
    }
    .play-bar-name {
      font-family: 'Bubblegum Sans', cursive;
      font-size: clamp(22px, 5dvh, 48px); line-height: 1.2;
    }

    .play-body {
      flex: 1; display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      padding: 24px 20px; text-align: center; gap: 20px;
      overflow-y: auto;
    }

    .play-art {
      width: min(36dvh, 72vw); height: min(36dvh, 72vw);
      border-radius: 16px; overflow: hidden;
      background: rgba(255,255,255,.07);
      display: flex; align-items: center; justify-content: center;
      flex-shrink: 0;
    }
    .play-art img { width: 100%; height: 100%; object-fit: cover; }
    .play-art-ph svg { width: min(14dvh, 28vw); height: min(14dvh, 28vw); }

    .play-np-section { width: 100%; max-width: 440px; }
    .play-np-label {
      font-size: clamp(18px, 4dvh, 32px); font-weight: 800;
      color: var(--accent); margin-bottom: 8px;
    }
    .play-np-artist {
      font-size: clamp(22px, 5dvh, 40px); font-weight: 800;
      color: var(--text); line-height: 1.2;
    }
    .play-np-title {
      font-size: clamp(16px, 3.5dvh, 28px); font-weight: 600;
      color: rgba(255,255,255,.8); line-height: 1.3; margin-top: 6px;
    }
    .play-np-album {
      font-size: clamp(12px, 2.2dvh, 20px); color: rgba(255,255,255,.45);
      margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .play-np-idle { font-size: 16px; color: var(--muted); }

    .play-upnext { width: 100%; max-width: 440px; }
    .play-un-label {
      font-size: 11px; letter-spacing: 2px; font-weight: 700;
      color: var(--muted); text-transform: uppercase; margin-bottom: 8px;
    }
    .play-un-item {
      font-size: 14px; color: var(--text); padding: 3px 0;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .play-un-item::before { content: "▸  "; color: var(--accent); }

    .play-footer { padding: 0 20px 40px; display: flex; flex-direction: column; gap: 16px; }
    .play-req-btn {
      width: 100%; background: var(--accent); color: #000;
      font-size: 18px; font-weight: 800; padding: 18px;
      border-radius: 16px; transition: opacity .15s;
    }
    .play-req-btn:active { opacity: .8; }

    /* ══════════════════════════════════════════════════════════════
       TOAST (confirmation popup on play screen)
    ══════════════════════════════════════════════════════════════ */
    .toast {
      position: fixed; inset: 0; z-index: 50;
      background: rgba(0,0,0,.82);
      display: flex; align-items: flex-start; justify-content: center;
      padding: 24px;
      overflow-y: auto;
      opacity: 0; pointer-events: none; transition: opacity .25s ease;
    }
    .toast.show { opacity: 1; pointer-events: auto; }
    .toast-box {
      background: var(--card); border: 2px solid var(--accent);
      border-radius: 18px; padding: 28px 24px 24px;
      width: 100%; max-width: 400px;
      display: flex; flex-direction: column; gap: 14px;
      margin: auto;
    }
    .toast-head { font-size: 20px; font-weight: 800; color: var(--text); text-align: center; }
    .toast-songs { display: flex; flex-direction: column; gap: 4px; }
    .toast-song { font-size: 15px; color: var(--accent); padding: 2px 0; }
    .toast-song::before { content: "♪  "; }
    .toast-msg  { font-size: 15px; color: var(--muted); line-height: 1.7; text-align: center; }
    .toast-name { display: block; font-size: 32px; font-weight: 900; color: var(--text); line-height: 1.15; margin: 4px 0; }
    .toast-amount { display: block; font-size: 36px; font-weight: 900; color: var(--accent); line-height: 1.1; }
    .toast-ok {
      width: 100%; background: var(--accent); color: #000;
      font-size: 18px; font-weight: 800; padding: 16px;
      border-radius: 12px; border: none; cursor: pointer;
      transition: opacity .15s;
    }
    .toast-ok:active { opacity: .8; }

    /* ══════════════════════════════════════════════════════════════
       BROWSE SCREEN
    ══════════════════════════════════════════════════════════════ */
    /* Portrait: fixed-height scroll container so top-bar stays sticky and basket
       is reachable by scrolling without covering the catalog */
    #s-browse { height: 100dvh; overflow-y: auto; }

    /* sticky header — only the logo/title row is fixed */
    .top-bar {
      position: sticky; top: 0; z-index: 10;
      background: #111;
    }
    .bar-header  { padding: 0 14px; min-height: clamp(80px, 20dvh, 180px); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid var(--border); }
    .browse-logo { flex-shrink: 0; cursor: pointer; display: flex; }
    .browse-logo svg { width: clamp(44px, 13dvh, 100px); height: clamp(44px, 13dvh, 100px); animation: spin 8s linear infinite; }
    .play-logo svg  { animation: spin 8s linear infinite; }
    .bar-info    { flex: 1; min-width: 0; }
    .bar-name    { font-family: 'Bubblegum Sans', cursive; font-size: clamp(22px, 5dvh, 48px); line-height: 1.2; cursor: pointer; }
    .now-playing { font-size: clamp(13px, 2.2dvh, 22px); color: var(--muted); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .now-playing b { color: var(--text); font-weight: 500; }

    /* breadcrumb */
    .breadcrumb {
      display: flex; flex-direction: column; gap: 5px;
      padding: 8px 14px 10px; border-bottom: 1px solid var(--border);
    }
    .crumb-row1 { display: flex; align-items: center; gap: 6px; }
    .crumb-row2 { display: flex; align-items: center; gap: 6px; }
    .crumb-back   { background: var(--accent); color: #111; font-size: 24px; font-weight: 900; border-radius: 50px; padding: 1px 13px 2px; }
    .crumb-cancel { background: var(--accent); color: #111; font-size: 20px; font-weight: 900; border-radius: 50px; padding: 2px 13px; margin-left: auto; }
    .crumb-home {
      color: var(--accent); font-size: 20px; font-weight: 800;
      padding: 2px 0; letter-spacing: .5px;
    }
    .crumb-link { color: var(--accent); font-size: 20px; font-weight: 800; padding: 2px 0; }
    .crumb-sep  { color: var(--muted); font-size: 18px; }
    .crumb-cur  { color: var(--text); font-size: 20px; font-weight: 800; }

    /* search */
    .search-wrap { padding: 8px 14px 10px; background: var(--bg); }
    .search-box {
      display: flex; align-items: center; gap: 8px;
      background: var(--card2); border: 1px solid var(--border); border-radius: 12px;
      padding: 10px 14px;
    }
    .search-box svg { flex-shrink: 0; color: var(--muted); }
    .search-box input { font-size: 16px; width: 100%; }
    .search-box input::placeholder { color: var(--muted); }
    .clear-btn { color: var(--muted); font-size: 18px; flex-shrink: 0; display: none; }
    .clear-btn.visible { display: block; }

    /* catalog area */
    .catalog { padding: 14px; }
    .section-title {
      font-family: 'Bubblegum Sans', cursive;
      font-size: clamp(14px, 2.2dvh, 22px); font-weight: 700; letter-spacing: 1.2px;
      color: rgba(255,255,255,.85); text-transform: uppercase;
      padding-bottom: clamp(8px, 1.5dvh, 14px);
    }
    .empty { text-align: center; color: var(--muted); padding: 48px 16px; font-size: 15px; }

    /* letter circles */
    .letter-grid { display: flex; flex-wrap: wrap; gap: 8px; }
    .letter-btn {
      flex-shrink: 0;
      width: clamp(44px, 13vmin, 68px); height: clamp(44px, 13vmin, 68px);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: clamp(14px, 4vmin, 22px); font-weight: 800; color: #111;
      transition: transform .1s;
    }
    .letter-btn:not(.dim):active { transform: scale(0.88); }
    .letter-btn.dim { background: #181818 !important; color: #2a2a2a; pointer-events: none; }

    /* name bubbles */
    .bubble-wrap { display: flex; flex-wrap: wrap; gap: clamp(9px, 1.5dvh, 14px); }
    .bubble {
      padding: 6px clamp(14px, 2dvh, 18px); border-radius: 50px;
      line-height: 1.05; font-size: clamp(22px, 4dvh, 34px); font-weight: 700;
      color: #111;
      transition: opacity .1s;
    }
    .bubble:active { opacity: .72; }
    .bubble.selected { box-shadow: 0 0 0 3px rgba(255,255,255,.7); }
    .bubble.dim-out  { opacity: .3; pointer-events: none; }

    /* ══════════════════════════════════════════════════════════════
       BASKET (fixed bottom panel, slides up)
    ══════════════════════════════════════════════════════════════ */
    .basket {
      display: none;
      background: #111; border-top: 2px solid var(--accent);
      padding: 12px 16px 28px;
    }
    .basket.show { display: block; }

    .basket-songs { margin-bottom: 10px; }
    .basket-row {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 0; border-bottom: 1px solid var(--border);
    }
    .basket-row:last-child { border-bottom: none; }
    .basket-num  { color: var(--accent); font-weight: 800; font-size: 15px; width: 18px; flex-shrink: 0; }
    .basket-info { flex: 1; min-width: 0; }
    .basket-title  { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .basket-artist { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .basket-rm { color: var(--error); font-size: 22px; flex-shrink: 0; line-height: 1; }

    .basket-total { font-size: 15px; font-weight: 800; color: #a78bfa; text-align: right; padding: 4px 0 8px; }
    .basket-footer { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
    .basket-name {
      width: 100%; background: var(--card2); border: 1px solid var(--border);
      border-radius: 10px; padding: 11px 14px; font-size: 15px;
    }
    .basket-name::placeholder { color: var(--muted); }
    .basket-name.missing     { border-color: var(--error); }
    .basket-submit {
      width: 100%; background: var(--accent); color: #000; font-weight: 800;
      font-size: 15px; padding: 13px 18px; border-radius: 10px;
    }
    .basket-submit:disabled { opacity: .45; pointer-events: none; }
    .basket-pay {
      width: 100%; background: #a78bfa; color: #000; font-weight: 800;
      font-size: 15px; padding: 13px 18px; border-radius: 10px;
    }
    .basket-pay:disabled { opacity: .45; pointer-events: none; }

    /* ══════════════════════════════════════════════════════════════
       PAY ONLINE OVERLAY
    ══════════════════════════════════════════════════════════════ */
    #pay-overlay {
      position: fixed; inset: 0; z-index: 80;
      background: var(--bg); display: none; flex-direction: column;
      overflow-y: auto;
    }
    #pay-overlay.open { display: flex; }
    .pay-header { padding: 20px 20px 12px; border-bottom: 1px solid var(--border); }
    .pay-header-top { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
    .pay-back  { font-size: 22px; color: var(--muted); flex-shrink: 0; line-height: 1; }
    .pay-title  { font-size: 20px; font-weight: 800; flex: 1; }
    .pay-amount { font-size: 32px; font-weight: 900; color: #a78bfa; }
    .pay-songs  { padding: 12px 20px; border-bottom: 1px solid var(--border); }
    .pay-song   { font-size: 14px; color: var(--muted); padding: 3px 0; }
    .pay-song::before { content: "♪  "; color: var(--accent); }
    .pay-element-wrap { padding: 20px; flex: 1; }
    #payment-element  { min-height: 100px; }
    .pay-error { color: var(--error); font-size: 14px; padding: 0 20px 10px; display: none; }
    .pay-error.show { display: block; }
    .pay-confirm-btn {
      margin: 0 20px 32px;
      width: calc(100% - 40px); background: #a78bfa; color: #000;
      font-size: 18px; font-weight: 800; padding: 16px;
      border-radius: 12px; border: none; cursor: pointer;
    }
    .pay-confirm-btn:disabled { opacity: .45; pointer-events: none; }

    /* ══════════════════════════════════════════════════════════════
       LANDSCAPE  —  browse screen
    ══════════════════════════════════════════════════════════════ */
    @media (orientation: landscape) {
      #s-browse { height: 100dvh; overflow: hidden; }
      .catalog { flex: 1; overflow: hidden; min-height: 0; padding: 10px 14px; padding-bottom: 0 !important; }
      .section-title { font-size: clamp(22px, 3.5dvh, 32px); padding-bottom: clamp(4px, 0.8dvh, 10px); }
      .bubble { font-size: clamp(18px, 3.5dvh, 28px); padding: 5px clamp(12px, 1.8dvh, 16px); }
      .breadcrumb { padding: 4px 14px 8px; }
      .search-wrap { padding: 4px 14px 5px; }
      .search-box { padding: 6px 12px; }
      /* Restore fixed-bottom basket for landscape (no page scroll in landscape) */
      .basket {
        display: block;
        position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
        transform: translateY(100%); transition: transform .28s ease;
        padding: 8px 14px 10px;
      }
      .basket.show { transform: translateY(0); }
      .basket-songs { margin-bottom: 6px; }
      .basket-row { padding: 4px 0; }
      .basket-footer { margin-top: 6px; }
      .basket-name { padding: 7px 10px; font-size: 13px; }
      .basket-submit { font-size: 13px; padding: 9px 14px; }
    }
  </style>
</head>
<body>

<!-- ── ERROR ─────────────────────────────────────────────────────────────── -->
<div id="s-error" class="screen">
  <div class="err-icon">🎵</div>
  <div class="err-title" id="err-title">Unavailable</div>
  <div class="err-msg"   id="err-msg">Something went wrong.</div>
</div>

<!-- ── PLAY (landing) ────────────────────────────────────────────────────── -->
<div id="s-play" class="screen">
  <div class="play-header">
    <button onclick="goHome()" title="Back to Now Playing" class="play-logo">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="clamp(44px,11dvh,80px)" height="clamp(44px,11dvh,80px)" style="width:clamp(44px,11dvh,80px);height:clamp(44px,11dvh,80px)">

        <line x1="36" y1="36" x2="45.2" y2="58.2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="36" y1="36" x2="36" y2="60" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="36" y1="36" x2="26.8" y2="58.2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="36" y1="36" x2="19" y2="53" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="36" y1="36" x2="13.8" y2="45.2" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="36" y1="36" x2="12" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="36" y1="36" x2="13.8" y2="26.8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="36" y1="36" x2="19" y2="19" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <line x1="36" y1="36" x2="26.8" y2="13.8" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="36" cy="36" r="4" fill="#ffffff"/>

<div id="s-browse" class="screen">

  <div class="breadcrumb" id="breadcrumb"></div>

  <div class="catalog" id="catalog"></div>

  <!-- basket -->

<!-- ── PAY ONLINE OVERLAY ───────────────────────────────────────────────── -->
<div id="pay-overlay">
  <div class="pay-header">
    <div class="pay-header-top">
      <button class="pay-back" onclick="closePayOverlay()">←</button>
      <div class="pay-title">💳 Pay Online</div>
    </div>
    <div class="pay-amount" id="pay-amount-label"></div>
  </div>
  <div class="pay-songs" id="pay-songs"></div>
  <div class="pay-element-wrap">
    <div id="payment-element"></div>
  </div>
  <div class="pay-error" id="pay-error"></div>
  <button class="pay-confirm-btn" id="pay-confirm-btn" onclick="confirmStripePayment()" disabled>Pay →</button>

<script>
// ── Constants ──────────────────────────────────────────────────────────────
const PALETTE    = ['#fda185','#fbbe84','#ffc24a','#dc7955','#e8406a'];
const ALPHA      = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ#'.split('');
const TITLE_COLS = ['#fda185','#fbbe84','#ffc24a','#dc7955','#e8406a','#ffffff'];

// ── State ──────────────────────────────────────────────────────────────────
function getCustomerId() {
  let id = localStorage.getItem('jb_customer_id');
  if (!id) {
    id = Math.random().toString(36).slice(2, 10).toUpperCase();
    localStorage.setItem('jb_customer_id', id);
  }
  return id;
}

const S = {
  jukebarId:       '',
  session:         '',
  customerId:      getCustomerId(),
  requireApproval:  true,
  bartenderEnabled: true,
  pricePerSong:     0,
  priceForThree:    0,
  currency:         '',
  stripeKey:        '',
  catalog:         [],
  songById:        {},
  tree:            [],   // [{artist, albums:[{album,songs:[...]}]}]
  selected:        [],   // max 3 song objects
  upNext:          [],
  colorMap:        new Map(),
  nav:             { level: 'letters', letter: '', artistIdx: -1, albumIdx: -1 },
};
let _toastTimer = null;

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  const pathParts = location.pathname.split('/').filter(Boolean);
  S.jukebarId = pathParts[pathParts.length - 1];
  S.session   = new URLSearchParams(location.search).get('s') || '';

  if (!S.jukebarId || !S.session)
    return showError('Invalid link', 'Please scan the QR code at the bar to get a fresh link.');

  try {
    const cacheKey = `jb_${S.jukebarId}_${S.session}`;
    let d;
    const cached = sessionStorage.getItem(cacheKey);
    if (cached) {
      d = JSON.parse(cached);
    } else {
      const res = await fetch(`/api/bar/${S.jukebarId}/catalog?s=${enc(S.session)}`);
      if (res.status === 403) { showScreen('s-play'); fetchDisplay(); setInterval(fetchDisplay, 5_000); return; }
      if (res.status === 404) return showError('Bar offline', 'This JukeBar is not reachable right now. Try again in a moment.');
      if (!res.ok)            return showError('Error', 'Could not load the playlist. Check your connection and try again.');
      d = await res.json();
      // Don't cache payment settings — they're refreshed live via fetchDisplay()
      const toCache = Object.assign({}, d, { bartender_enabled: undefined, stripe_publishable_key: undefined });
      try { sessionStorage.setItem(cacheKey, JSON.stringify(toCache)); } catch {}
    }
    S.requireApproval  = d.require_approval  !== false;
    S.bartenderEnabled = d.bartender_enabled !== false;
    S.pricePerSong     = d.price_per_song  || 0;
    S.priceForThree    = d.price_for_three || 0;
    S.currency         = d.currency        || '';
    S.stripeKey        = d.stripe_publishable_key || '';
    S.catalog         = d.catalog         || [];

    const barName = d.bar_name || 'JukeBar';
    const title   = barName.startsWith('JukeBar') ? barName : `JukeBar ${barName}`;
    colorize($('bar-name'),      title);
    colorize($('play-bar-name'), title);
    document.title = title;

    buildIndex();
    renderBrowse();
    showScreen('s-play');

    fetchDisplay();
    setInterval(fetchDisplay, 5_000);
  } catch {
    showError('Network error', 'Check your connection and try again.');
  }
}

// ── Index ──────────────────────────────────────────────────────────────────
function sortKey(s) {
  return s.replace(/^the\s+/i, '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
}
function firstLetter(artist) {
  const ch = (sortKey(artist).charAt(0) || '').toUpperCase();
  return /[A-Z]/.test(ch) ? ch : '#';
}

function buildIndex() {
  S.songById = {};
  const map  = {};
  for (const s of S.catalog) {
    S.songById[s.id] = s;
    const a  = s.artist || 'Unknown Artist';
    const al = s.album  || 'Unknown Album';
    if (!map[a])     map[a] = {};
    if (!map[a][al]) map[a][al] = [];
    map[a][al].push(s);
  }
  S.tree = Object.keys(map)
    .sort((a, b) => sortKey(a).localeCompare(sortKey(b)))
    .map(artist => ({
      artist,
      albums: Object.keys(map[artist])
        .sort((a, b) => a.localeCompare(b))
        .map(album => ({ album, songs: map[artist][album].sort((a, b) => (a.title||'').localeCompare(b.title||'')) }))
    }));
  S.colorMap = new Map(S.tree.map((node, i) => [node.artist, PALETTE[i % PALETTE.length]]));
}

// Rainbow colorize (Bubblegum Sans style)
function colorize(el, text) {
  if (!el) return;
  el.innerHTML = '';
  let last = '';
  for (const ch of text) {
    if (ch === ' ') { el.appendChild(document.createTextNode(' ')); continue; }
    const pool = TITLE_COLS.filter(c => c !== last);
    const color = pool[Math.floor(Math.random() * pool.length)];
    last = color;
    const s = document.createElement('span');
    s.style.color = color; s.textContent = ch;
    el.appendChild(s);
  }
}

// ── Display (now-playing + up-next, session-agnostic) ────────────────────────
async function fetchDisplay() {
  try {
    const res = await fetch(`/api/bar/${S.jukebarId}/display?s=${enc(S.session)}`);
    if (!res.ok) return;
    const d = await res.json();

    if (d.session_valid === false) return showError('Link expired', 'Please scan the current QR code at the bar to continue.');

    // Live payment settings — pushed from host on every propagateBarDetails()
    if ('bartender_enabled' in d) {
      const changed = S.bartenderEnabled !== (d.bartender_enabled !== false)
                   || S.stripeKey !== (d.stripe_publishable_key || '');
      S.bartenderEnabled = d.bartender_enabled !== false;
      S.stripeKey        = d.stripe_publishable_key || '';
      if (changed && $('basket')?.classList.contains('show')) renderBasket();
    }

    const song = d.now_playing || null;

    // Browse header (small)
    $('now-playing').innerHTML = song
      ? `<b>${esc(song.artist || '')}</b>${song.title ? ` · ${esc(song.title)}` : ''}`
      : 'Nothing playing right now';

    // Play screen artwork
    const artPh = $('play-art-ph');
    const existingImg = $('play-art')?.querySelector('img');
    if (song?.artwork_data_url) {
      if (existingImg) {
        existingImg.src = song.artwork_data_url;
      } else {
        const img = document.createElement('img');
        img.src = song.artwork_data_url;
        $('play-art').prepend(img);
      }
      if (artPh) artPh.style.display = 'none';
    } else {
      if (existingImg) existingImg.remove();
      if (artPh) artPh.style.display = '';
    }

    // Play screen text (large)
    $('play-np').innerHTML = song
      ? `<div class="play-np-artist">${esc(song.artist || '')}</div>
         <div class="play-np-title">${esc(song.title || '')}</div>
         ${song.album ? `<div class="play-np-album">${esc(song.album)}</div>` : ''}`
      : `<div class="play-np-idle">Nothing playing right now</div>`;

    // Up Next
    const approved = (d.requests || [])
      .sort((a, b) => {
        const aj = a.status === 'approved_jump' || a.jump === true;
        const bj = b.status === 'approved_jump' || b.jump === true;
        if (aj !== bj) return aj ? -1 : 1;
        const at = new Date((a.approved_at || a.created_at) * 1000).getTime();
        const bt = new Date((b.approved_at || b.created_at) * 1000).getTime();
        return aj ? bt - at : at - bt;
      });
    S.upNext = approved;

    const unEl = $('play-upnext');
    if (approved.length) {
      const items = approved.flatMap(r => {
        const nameHtml = r.requester_name ? `<span style="color:#fde047;font-weight:700">${esc(r.requester_name.slice(0, 8))}</span>: ` : '';
        const details = r.song_details || [];
        if (details.length) {
          return details.map(s => `<div class="play-un-item">${nameHtml}${esc(s.artist)} — ${esc(s.album)} — ${esc(s.title)}</div>`);
        }
        return (r.song_titles || []).map(t => `<div class="play-un-item">${nameHtml}${esc(t)}</div>`);
      }).slice(0, 6).join('');
      unEl.innerHTML = `<div class="play-un-label">Up Next</div>${items}`;
    } else {
      unEl.innerHTML = `<div class="play-un-label">Up Next</div><div class="play-un-item" style="color:var(--muted);opacity:.5">Shuffling…</div>`;
    }

    if (S.nav.level === 'letters' && $('s-browse').classList.contains('active')) renderLetters();
  } catch {}
}

// ── Render browse ────────────────────────────────────────────────────────────
function renderBrowse() {
  const q = ($('search').value || '').trim().toLowerCase();
  renderBreadcrumb();
  if (q) { renderSearch(q); return; }
  const { level } = S.nav;
  if (level === 'letters') renderLetters();
  else if (level === 'artists') renderArtists();
  else if (level === 'albums')  renderAlbums();
  else renderSongs();
}

function renderBreadcrumb() {
  const { level, letter, artistIdx, albumIdx } = S.nav;

  // Row 1: ‹  A-Z  [sep Letter]  ✕
  const r1 = [];
  if (level === 'letters') {
    r1.push(`<button class="crumb-back" onclick="goHome()">‹</button>`);
  } else {
    const backTo = level === 'artists' ? 'letters' : level === 'albums' ? 'artists' : 'albums';
    r1.push(`<button class="crumb-back" onclick="drillBack('${backTo}')">‹</button>`);
  }
  r1.push(`<button class="crumb-home" onclick="drillBack('letters')">A–Z</button>`);
  if (level !== 'letters') {
    r1.push(`<span class="crumb-sep">›</span>`);
    if (level === 'artists')
      r1.push(`<span class="crumb-cur">${esc(letter)}</span>`);
    else
      r1.push(`<button class="crumb-link" onclick="drillBack('artists')">${esc(letter)}</button>`);
  }
  r1.push(`<button class="crumb-cancel" onclick="cancelBrowse()">✕</button>`);

  // Row 2: Band [sep Album]  — only at albums/songs level
  const r2 = [];
  if (level === 'albums' || level === 'songs') {
    const artist = S.tree[artistIdx]?.artist || '';
    const artistTrunc = artist.length > 8 ? artist.slice(0, 8) + '…' : artist;
    if (level === 'albums')
      r2.push(`<span class="crumb-cur">${esc(artistTrunc)}</span>`);
    else
      r2.push(`<button class="crumb-link" onclick="drillBack('albums')">${esc(artistTrunc)}</button>`);
  }
  if (level === 'songs') {
    const album = S.tree[artistIdx]?.albums[albumIdx]?.album || 'Unknown Album';
    const albumTrunc = album.length > 8 ? album.slice(0, 8) + '…' : album;
    r2.push(`<span class="crumb-sep">›</span>`);
    r2.push(`<span class="crumb-cur">${esc(albumTrunc)}</span>`);
  }

  $('breadcrumb').innerHTML = `<div class="crumb-row1">${r1.join('')}</div>` +
    (r2.length ? `<div class="crumb-row2">${r2.join('')}</div>` : '');
}

function goHome() {
  if ($('pay-overlay').classList.contains('open')) closePayOverlay();
  dismissToast();
  S.selected = [];
  S.nav = { level: 'letters', letter: '', artistIdx: -1, albumIdx: -1 };
  $('search').value = ''; $('clear-btn').classList.remove('visible');
  renderBasket();
  renderBrowse();
  showScreen('s-play');
}
function cancelBrowse() { goHome(); }

function _fgFor(hex) {
  const r = parseInt(hex.slice(1,3), 16) / 255;
  const g = parseInt(hex.slice(3,5), 16) / 255;
  const b = parseInt(hex.slice(5,7), 16) / 255;
  return (0.2126*r + 0.7152*g + 0.0722*b) > 0.55 ? '#111' : '#fff';
}

function renderLetters() {
  if (!S.tree.length) { $('catalog').innerHTML = '<div class="empty">No songs in this playlist.</div>'; return; }
  const has = new Set(S.tree.map(n => firstLetter(n.artist)));
  $('catalog').innerHTML = '<div class="section-title">BANDS</div><div class="letter-grid">' +
    ALPHA.map((l, i) => {
      const active = has.has(l);
      const col    = PALETTE[i % PALETTE.length];
      const style  = active ? `background:${col};color:${_fgFor(col)}` : '';
      return `<div class="letter-btn${active ? '' : ' dim'}" style="${style}"${active ? ` onclick="drillLetter('${l}')"` : ''}>${l}</div>`;
    }).join('') + '</div>';
}

function renderArtists() {
  const artists = S.tree
    .map((node, i) => ({ node, i }))
    .filter(({ node }) => firstLetter(node.artist) === S.nav.letter);
  if (!artists.length) { drillBack('letters'); return; }
  $('catalog').innerHTML = '<div class="section-title">BANDS</div><div class="bubble-wrap">' +
    artists.map(({ node, i }) => {
      const col = S.colorMap.get(node.artist) ?? PALETTE[i % PALETTE.length];
      const fg  = _fgFor(col);
      return `<div class="bubble" style="background:${col};color:${fg}" onclick="drillArtist(${i})">${esc(node.artist)}</div>`;
    }).join('') + '</div>';
}

function renderAlbums() {
  const node = S.tree[S.nav.artistIdx];
  if (!node) { drillBack('artists'); return; }
  $('catalog').innerHTML = '<div class="section-title">ALBUMS</div><div class="bubble-wrap">' +
    node.albums.map((a, i) => {
      const col = PALETTE[i % PALETTE.length];
      const fg  = _fgFor(col);
      return `<div class="bubble" style="background:${col};color:${fg}" onclick="drillAlbum(${i})">${esc(a.album || 'Unknown Album')}</div>`;
    }).join('') + '</div>';
}

function renderSongs() {
  const node  = S.tree[S.nav.artistIdx];
  const album = node?.albums[S.nav.albumIdx];
  if (!album) { drillBack('albums'); return; }
  const full = S.selected.length >= 3;
  $('catalog').innerHTML = '<div class="section-title">SONGS — tap to select (max 3)</div><div class="bubble-wrap">' +
    album.songs.map((s, i) => {
      const sel  = S.selected.some(x => x.id === s.id);
      const dim  = !sel && full;
      const col  = PALETTE[i % PALETTE.length];
      const fg   = _fgFor(col);
      const mark = sel ? ' ✓' : '';
      const cls  = `bubble${sel ? ' selected' : ''}${dim ? ' dim-out' : ''}`;
      return `<div class="${cls}" style="background:${col};color:${fg}" data-id="${esc(s.id)}" onclick="toggleSong(this)">${esc(s.title)}${mark}</div>`;
    }).join('') + '</div>';
}

function renderSearch(q) {
  const hits = S.catalog.filter(s =>
    (s.title || '').toLowerCase().includes(q) ||
    (s.artist|| '').toLowerCase().includes(q) ||
    (s.album || '').toLowerCase().includes(q)
  );
  if (!hits.length) { $('catalog').innerHTML = '<div class="empty">No results.</div>'; return; }
  const full = S.selected.length >= 3;
  $('catalog').innerHTML = '<div class="bubble-wrap">' +
    hits.map((s, i) => {
      const sel  = S.selected.some(x => x.id === s.id);
      const dim  = !sel && full;
      const col  = PALETTE[i % PALETTE.length];
      const fg   = _fgFor(col);
      const mark = sel ? ' ✓' : '';
      const cls  = `bubble${sel ? ' selected' : ''}${dim ? ' dim-out' : ''}`;
      const label = esc(s.title) + (s.artist ? ` — ${esc(s.artist)}` : '');
      return `<div class="${cls}" style="background:${col};color:${fg}" data-id="${esc(s.id)}" onclick="toggleSong(this)">${label}${mark}</div>`;
    }).join('') + '</div>';
}

// ── Navigation ────────────────────────────────────────────────────────────────
function drillLetter(l)  { S.nav = { level: 'artists', letter: l, artistIdx: -1, albumIdx: -1 }; renderBrowse(); }
function drillArtist(i)  { S.nav = { ...S.nav, level: 'albums',  artistIdx: i, albumIdx: -1 }; renderBrowse(); }
function drillAlbum(i)   { S.nav = { ...S.nav, level: 'songs',   albumIdx: i }; renderBrowse(); }
function drillBack(to) {
  if (to === 'letters') S.nav = { level: 'letters', letter: '', artistIdx: -1, albumIdx: -1 };
  else if (to === 'artists') S.nav = { ...S.nav, level: 'artists', albumIdx: -1 };
  else if (to === 'albums')  S.nav = { ...S.nav, level: 'albums',  albumIdx: -1 };
  renderBrowse();
}

// ── Song selection ─────────────────────────────────────────────────────────────
function toggleSong(el) {
  const id = el.dataset.id;
  const s  = S.songById[id];
  if (!s) return;
  const idx = S.selected.findIndex(x => x.id === id);
  if (idx >= 0) S.selected.splice(idx, 1);
  else if (S.selected.length < 3) S.selected.push(s);
  renderBrowse();
  renderBasket();
}

function removeFromBasket(i) {
  S.selected.splice(i, 1);
  renderBrowse();
  renderBasket();
}

function basketTotal() {
  const count = S.selected.length;
  if (!count || S.pricePerSong <= 0) return 0;
  if (count === 3 && S.priceForThree > 0) return S.priceForThree;
  return S.pricePerSong * count;
}

function renderBasket() {
  const basket = $('basket');
  if (!S.selected.length) { basket.classList.remove('show'); return; }
  $('basket-songs').innerHTML = S.selected.map((s, i) => `
<div class="basket-row">
  <div class="basket-num">${i + 1}</div>
  <div class="basket-info">
    <div class="basket-title">${esc(s.title)}</div>
    <div class="basket-artist">${esc(s.artist)}${s.album ? ` · ${esc(s.album)}` : ''}</div>
  </div>
  <button class="basket-rm" onclick="removeFromBasket(${i})">✕</button>
</div>`).join('');
  const total = basketTotal();
  $('basket-total').textContent = total > 0 ? `Total: ${S.currency} ${total.toFixed(2)}` : '';
  basket.classList.add('show');
  $('rb-pay-btn').style.display    = (S.stripeKey && total > 0) ? '' : 'none';
  $('submit-btn').style.display    = S.bartenderEnabled ? '' : 'none';
  basket.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

// ── Request flow ───────────────────────────────────────────────────────────────
function startRequest() {
  showScreen('s-browse');
}

async function submitRequest() {
  if (!S.selected.length) return;
  const nameEl = $('requester-name');
  const name   = (nameEl.value || '').trim();
  if (!name) {
    nameEl.classList.add('missing');
    nameEl.focus();
    nameEl.addEventListener('input', () => nameEl.classList.remove('missing'), { once: true });
    return;
  }
  const btn = $('submit-btn');
  btn.disabled = true; btn.textContent = 'Sending…';

  try {
    const res = await fetch(`/api/bar/${S.jukebarId}/request?s=${enc(S.session)}`, {
      method:  'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({
        song_ids:       S.selected.map(s => s.id),
        song_titles:    S.selected.map(s => s.title),
        requester_name: name,
        customer_id:    S.customerId,
        jump:           false,
      }),
    });
    if (res.status === 403) { btn.disabled = false; btn.textContent = 'Submit to Bartender'; showError('Link expired', 'Please scan the current QR code at the bar to request songs.'); return; }
    if (!res.ok) throw new Error(res.status);
    const { status } = await res.json();
    const submitted = [...S.selected];

    S.selected = [];
    S.nav = { level: 'letters', letter: '', artistIdx: -1, albumIdx: -1 };
    btn.disabled = false; btn.textContent = 'Submit to Bartender';
    renderBasket();
    renderBrowse();

    returnToPlay(status || 'pending', submitted, name);
  } catch {
    btn.disabled = false; btn.textContent = 'Submit to Bartender';
    alert('Submission failed — check your connection and try again.');
  }
}

function returnToPlay(status, songs, requesterName) {
  showScreen('s-play');
  showToast(status, songs, requesterName);
}

// ── Toast ──────────────────────────────────────────────────────────────────────
function showToast(status, songs, requesterName) {
  const count = songs.length;
  const total = S.pricePerSong > 0
    ? (count === 3 && S.priceForThree > 0 ? S.priceForThree : S.pricePerSong * count)
    : 0;
  const needsApproval = status !== 'approved' && S.requireApproval;

  const songHtml = `<div class="toast-songs">${songs.map(s => `<div class="toast-song">${esc(s.title)}</div>`).join('')}</div>`;

  let msgHtml;
  if (needsApproval) {
    const payHtml = total > 0
      ? `<span class="toast-amount">${S.currency} ${total.toFixed(2)}</span>`
      : '';
    msgHtml = `<div class="toast-msg">Get the bartender/staff to approve your request under the name<span class="toast-name">${esc(requesterName)}</span>${total > 0 ? `after paying${payHtml}` : ''}</div>`;
  } else {
    msgHtml = `<div class="toast-msg">Your songs are in the queue — sit tight!</div>`;
  }

  $('toast-inner').innerHTML = `<div class="toast-head">Request submitted!</div>${songHtml}${msgHtml}`;
  $('toast').classList.add('show');
}

function dismissToast() {
  $('toast').classList.remove('show');
  clearTimeout(_toastTimer);
}

// ── Search ─────────────────────────────────────────────────────────────────────
function clearSearch() {
  $('search').value = ''; $('clear-btn').classList.remove('visible');
  renderBrowse();
}

// ── Utilities ──────────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}
function showError(title, msg) {
  $('err-title').textContent = title;
  $('err-msg').textContent   = msg;
  showScreen('s-error');
}
function $(id)    { return document.getElementById(id); }
function enc(s)   { return encodeURIComponent(s); }
function esc(str) { return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ── Stripe ────────────────────────────────────────────────────────────────────
let _stripe = null;
let _stripeElements = null;

function loadStripeJs() {
  return new Promise((resolve, reject) => {
    if (window.Stripe) { resolve(); return; }
    const s = document.createElement('script');
    s.src = 'https://js.stripe.com/v3/';
    s.onload  = resolve;
    s.onerror = () => reject(new Error('Stripe.js failed to load'));
    document.head.appendChild(s);
  });
}

async function reqPayOnline() {
  if (!S.selected.length) return;
  const nameEl = $('requester-name');
  const name   = (nameEl.value || '').trim();
  if (!name) {
    nameEl.classList.add('missing');
    nameEl.focus();
    nameEl.addEventListener('input', () => nameEl.classList.remove('missing'), { once: true });
    return;
  }
  localStorage.setItem('jb_name', name);

  const btn   = $('rb-pay-btn');
  btn.disabled = true;
  const total  = basketTotal();

  $('pay-amount-label').textContent = `${S.currency} ${total.toFixed(2)}`;
  $('pay-songs').innerHTML = S.selected.map(s => `<div class="pay-song">${esc(s.title)}</div>`).join('');
  $('pay-error').textContent = ''; $('pay-error').classList.remove('show');
  $('pay-confirm-btn').disabled = true; $('pay-confirm-btn').textContent = 'Loading…';
  $('pay-overlay').classList.add('open');

  try {
    await loadStripeJs();
    const res = await fetch(`/api/bar/${S.jukebarId}/create-payment-intent?s=${enc(S.session)}`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ song_ids: S.selected.map(s => s.id), song_titles: S.selected.map(s => s.title), customer_name: name }),
    });
    if (res.status === 403) { closePayOverlay(); showError('Link expired', 'Please scan the current QR code at the bar to request songs.'); return; }
    if (!res.ok) throw new Error(await res.text().catch(() => `HTTP ${res.status}`));
    const data = await res.json();
    const { client_secret, payment_intent_id: piId } = data;
    if (data.currency && data.currency.toUpperCase() !== S.currency.toUpperCase()) {
      throw new Error(`Server currency mismatch: host is using ${data.currency.toUpperCase()} but page loaded with ${S.currency}. Please reload and try again.`);
    }

    if (!_stripe) _stripe = Stripe(S.stripeKey);
    _stripeElements = _stripe.elements({ clientSecret: client_secret, appearance: {
      theme: 'night',
      variables: { colorPrimary: '#a78bfa', colorBackground: '#1e1e1e', colorText: '#f0ece8' },
    }});
    const el = _stripeElements.create('payment');
    $('payment-element').innerHTML = '';
    el.mount('#payment-element');
    el.on('ready', () => {
      $('pay-confirm-btn').disabled = false;
      $('pay-confirm-btn').textContent = `Pay ${S.currency} ${total.toFixed(2)} →`;
    });

    sessionStorage.setItem('jb_pending_payment', JSON.stringify({
      payment_intent_id: piId,
      song_ids:          S.selected.map(s => s.id),
      customer_name:     name,
      customer_id:       S.customerId,
    }));
  } catch (e) {
    showPayError(e.message || 'Could not start payment — check your connection.');
    $('pay-confirm-btn').disabled = true; $('pay-confirm-btn').textContent = 'Pay →';
  } finally {
    btn.disabled = false;
  }
}

async function confirmStripePayment() {
  if (!_stripeElements) return;
  const btn = $('pay-confirm-btn');
  btn.disabled = true; btn.textContent = 'Processing…';
  $('pay-error').classList.remove('show');

  const returnUrl = window.location.href.split('?')[0] + '?s=' + enc(S.session);
  const { error, paymentIntent } = await _stripe.confirmPayment({
    elements: _stripeElements,
    confirmParams: { return_url: returnUrl },
    redirect: 'if_required',
  });

  if (error) {
    showPayError(error.message || 'Payment failed — please try again.');
    btn.disabled = false; btn.textContent = 'Retry →';
    return;
  }
  if (paymentIntent?.status === 'succeeded') await finishPaidRequest(paymentIntent.id);
}

async function finishPaidRequest(piId) {
  const pending = JSON.parse(sessionStorage.getItem('jb_pending_payment') || 'null');
  if (!pending) return;
  try {
    const res = await fetch(`/api/bar/${S.jukebarId}/payment-confirmed?s=${enc(S.session)}`, {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ ...pending, payment_intent_id: piId }),
    });
    if (!res.ok) throw new Error(res.status);
    sessionStorage.removeItem('jb_pending_payment');
    closePayOverlay();
    const submitted = [...S.selected];
    const name = pending.customer_name;
    S.selected = [];
    S.nav = { level: 'letters', letter: '', artistIdx: -1, albumIdx: -1 };
    renderBasket(); renderBrowse();
    showScreen('s-play');
    showToast('approved', submitted, name);
  } catch {
    showPayError('Payment taken but request failed — show this screen to the bartender.');
  }
}

function showPayError(msg) { $('pay-error').textContent = msg; $('pay-error').classList.add('show'); }

function closePayOverlay() {
  $('pay-overlay').classList.remove('open');
  _stripeElements = null;
  $('payment-element').innerHTML = '';
}

async function handleStripeReturn() {
  const params = new URLSearchParams(window.location.search);
  if (params.get('redirect_status') !== 'succeeded') return;
  const piId    = params.get('payment_intent');
  const pending = JSON.parse(sessionStorage.getItem('jb_pending_payment') || 'null');
  if (!piId || !pending) return;
  S.session = new URLSearchParams(location.search).get('s') || '';
  S.jukebarId = location.pathname.split('/').filter(Boolean).pop() || '';
  history.replaceState(null, '', window.location.pathname + '?s=' + enc(S.session));
  await finishPaidRequest(piId);
}

// ── Start ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  const inp = $('search');
  inp.addEventListener('input', e => {
    $('clear-btn').classList.toggle('visible', e.target.value.length > 0);
    renderBrowse();
  });
  inp.addEventListener('search', () => renderBrowse());
  handleStripeReturn();
  boot();
});
</script>
