<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JukeBars — Find a bar near you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.5.3/dist/MarkerCluster.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://unpkg.com/leaflet.markercluster@1.5.3/dist/leaflet.markercluster.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #111;
  --card:   #1e1e1e;
  --border: #333;
  --text:   #fff;
  --muted:  #888;
  --accent: #fda185;
  --live:   #4ade80;
}

html, body { height: 100%; background: #e8e0d8; color: var(--text); font-family: Helvetica, Arial, sans-serif; }

/* ── Header ── */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(17,17,17,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex; align-items: center; gap: 12px;
}
.brand-link {
  display: flex; align-items: center; gap: 8px;
  text-decoration: none; flex: 1;
}
.brand-link:hover { opacity: .85; }
.brand-name {
  font-family: 'Bubblegum Sans', cursive;
  font-size: 22px; color: var(--accent); line-height: 1;
}
.brand-sub { font-size: 11px; color: var(--muted); margin-top: 1px; }
#bar-count { font-size: 12px; color: var(--muted); white-space: nowrap; }

/* ── Map ── */
#map { position: fixed; inset: 0; top: 54px; z-index: 0; }

/* ── Panel ── */
#panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
  background: var(--card); border-top: 2px solid var(--accent);
  border-radius: 18px 18px 0 0;
  padding: 0 0 env(safe-area-inset-bottom);
  max-height: 65dvh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .3s ease;
}
#panel.open { transform: translateY(0); }

.panel-drag {
  flex-shrink: 0; text-align: center; padding: 10px 0 4px; cursor: pointer;
}
.panel-drag::before {
  content: ""; display: inline-block;
  width: 36px; height: 4px; border-radius: 2px; background: var(--border);
}

.panel-head {
  flex-shrink: 0; padding: 0 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.panel-title-row { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; flex: 1; min-width: 0; }
.panel-name  { font-size: 20px; font-weight: 800; line-height: 1.2; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.panel-meta  { font-size: 12px; color: var(--muted); white-space: nowrap; }
.live-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--live);
  margin-right: 5px; animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .5; transform: scale(.75); }
}
.panel-close {
  flex-shrink: 0; background: none; border: none; color: var(--muted);
  font-size: 22px; cursor: pointer; padding: 2px 4px; line-height: 1;
}

.bubble-scroll {
  flex: 1; overflow-y: auto;
  padding: 0 14px 20px;
}
.playlist-section + .playlist-section {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--border);
}
.playlist-line { font-size: 14px; font-weight: 700; margin-bottom: 6px; }
.playlist-line-note { font-weight: 400; color: var(--muted); }
.bubble-wrap {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.bubble {
  border-radius: 20px; padding: 7px 16px;
  font-size: 14px; font-weight: 700;
  white-space: nowrap;
}

/* ── Empty state ── */
#empty {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; color: var(--muted); z-index: 100; pointer-events: none;
  display: none;
  background: rgba(30,30,30,.88); border: 1px solid var(--border);
  border-radius: 14px; padding: 24px 32px;
}
#empty h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }

/* ── Leaflet tooltip ── */
.jb-tooltip {
  background: rgba(30,30,30,.95); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px;
  color: var(--text); font-family: Helvetica, Arial, sans-serif;
  font-size: 13px; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  white-space: nowrap;
}
.jb-tooltip::before { display: none; }
.jb-tooltip strong { color: var(--accent); }

/* ── Leaflet marker overrides ── */
.jb-marker {
  width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid #fff; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.5);
  cursor: pointer;
}
.jb-marker.live { background: var(--live); border-color: #fff; }

/* ── Cluster markers ── */
.jb-cluster {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent); border: 3px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #111;
  box-shadow: 0 2px 10px rgba(0,0,0,.55); cursor: pointer;
}
.jb-cluster.large { width: 46px; height: 46px; font-size: 15px; }
</style>
</head>
<body>

<div class="top-bar">
  <a href="/" class="brand-link">
    <svg width="30" height="30" viewBox="0 0 72 72" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <circle cx="36" cy="36" r="34" fill="#fbbe84" stroke="#dc7955" stroke-width="1.5"/>
      <circle cx="36" cy="36" r="29" fill="#ffffff"/>
      <circle cx="36" cy="36" r="24" fill="#fda185"/>
      <line x1="36" y1="36" x2="36"    y2="12"    stroke="white" stroke-width="0.8" opacity="0.6"/>
      <line x1="36" y1="36" x2="52.97" y2="19.03" stroke="white" stroke-width="0.8" opacity="0.6"/>
      <line x1="36" y1="36" x2="60"    y2="36"    stroke="white" stroke-width="0.8" opacity="0.6"/>
      <line x1="36" y1="36" x2="52.97" y2="52.97" stroke="white" stroke-width="0.8" opacity="0.6"/>
      <line x1="36" y1="36" x2="36"    y2="60"    stroke="white" stroke-width="0.8" opacity="0.6"/>
      <line x1="36" y1="36" x2="19.03" y2="52.97" stroke="white" stroke-width="0.8" opacity="0.6"/>
      <line x1="36" y1="36" x2="12"    y2="36"    stroke="white" stroke-width="0.8" opacity="0.6"/>
      <line x1="36" y1="36" x2="19.03" y2="19.03" stroke="white" stroke-width="0.8" opacity="0.6"/>
    </svg>
    <div>
      <div class="brand-name" id="brand-name">JukeBars</div>
      <div class="brand-sub">Find JukeBars near you and see what bands they play!</div>
    </div>
  </a>
  <div id="bar-count"></div>
</div>

<div id="map"></div>

<div id="empty">
  <h2>No JukeBars registered yet</h2>
  <p>Bars appear here when owners opt in to the community map.</p>
</div>

<div id="panel">
  <div class="panel-drag" onclick="closePanel()"></div>
  <div class="panel-head">
    <div class="panel-title-row">
      <div class="panel-name" id="panel-name"></div>
      <div class="panel-meta" id="panel-meta"></div>
    </div>
    <button class="panel-close" onclick="closePanel()">✕</button>
  </div>
  <div class="bubble-scroll">
    <div class="bubble-wrap" id="panel-bubbles"></div>
  </div>
</div>

<script>
// Set from /api/map response. When true, use genre colors; grey for unprofiled artists.
let profilingOn = false;

// Rotating palette used when profiling is off
const PALETTE = [
  '#e63946','#f4a261','#e9c46a','#2a9d8f','#457b9d',
  '#6a4c93','#f77f00','#4cc9f0','#c77dff','#06d6a0',
  '#ff595e','#ffca3a','#8ac926','#1982c4','#ff924c',
];

// band_color string → hex  (matches values in tag_map.json)
const GENRE_COLORS = {
  // indie / alternative (blues)
  'indie':               '#5b8db8',
  'indie pop':           '#6fa3cc',
  'alternative':         '#4a7aa0',
  'grunge':              '#4a6d82',
  'noise rock':          '#3d5f6e',
  'math rock':           '#4a7a8a',
  'chillwave':           '#7aafc0',
  'kiwi':                '#4db89a',
  // rock (reds)
  'rock':                '#e63946',
  'classic rock':        '#d4293a',
  'progressive':         '#b82030',
  'post-rock':           '#c4384a',
  'glam':                '#e8557a',
  'rock n roll':         '#e84050',
  // metal (near-black)
  'heavy metal':         '#2b2d42',
  'metal':               '#333344',
  'black metal':         '#111827',
  'death metal':         '#1f2937',
  'thrash metal':        '#1a2035',
  'doom metal':          '#2e3152',
  'gothic metal':        '#3b1a4a',
  'grindcore':           '#0d0d0d',
  // post-punk / darkwave (purples)
  'post-punk':           '#6a4c93',
  'darkwave':            '#4a2c7e',
  'lo-fi':               '#7060a0',
  'gothic rock':         '#5a1a6e',
  'ebm':                 '#3a1a5e',
  // electronic / dance (cyans)
  'electro / electronica':'#4cc9f0',
  'house':               '#22b4e8',
  'techno':              '#0090cc',
  'drum & bass':         '#0076aa',
  'dubstep':             '#5ce1e6',
  'trance':              '#33ccff',
  'idm / glitch':        '#66d9e8',
  'synthpop':            '#00bfff',
  'synthwave':           '#b366ff',
  'dance / club':        '#44c8f0',
  'electropop':          '#55d4e8',
  // folk / acoustic (earthy greens)
  'folk':                '#3aad6f',
  'folktronica':         '#5a9e7a',
  // country (warm tan)
  'country':             '#d4a373',
  // punk / hardcore (oranges)
  'punk rock':           '#f77f00',
  'hardcore':            '#e06a00',
  'post-hardcore':       '#c85a00',
  'emo':                 '#d45500',
  'pop punk':            '#ff924c',
  'melodic hardcore':    '#e07020',
  // psychedelic (violets)
  'psychedelic':         '#c77dff',
  'space / atmospheric': '#9966cc',
  // ambient / experimental (teals)
  'ambient':             '#06d6a0',
  'experimental':        '#00b890',
  'dark ambient':        '#0a8060',
  'avant-garde':         '#20c090',
  'noise':               '#008060',
  'new age':             '#40e0c0',
  'drone / ambient rock':'#30c0a0',
  'minimal':             '#50d0b0',
  // hip-hop (ambers)
  'hip-hop':             '#f4a261',
  'trap':                '#e8904a',
  'gangsta rap':         '#d07830',
  'conscious hip-hop':   '#f0aa70',
  'underground hip-hop': '#d88040',
  // jazz (golds)
  'jazz':                '#e9c46a',
  'jazz fusion':         '#f0c050',
  'smooth jazz':         '#ddb850',
  'acid jazz':           '#f2c860',
  'bebop':               '#e0b840',
  'big band / swing':    '#d4a830',
  'nu jazz':             '#f4ce80',
  // classical (warm cream)
  'classical':           '#c8b280',
  // r&b / soul / funk (terracotta)
  'soul':                '#dc7955',
  'funk':                '#e88040',
  'r&b':                 '#d06040',
  'motown':              '#c85030',
  'neo soul':            '#e89060',
  'blues':               '#4a7ab0',
  // new wave (electric blue)
  'new wave':            '#00b4d8',
  // shoegaze / dream pop (lavender)
  'shoegaze / dream pop':'#b5a4dc',
  'slowcore':            '#8a78b8',
  'noise pop':           '#c0b0e8',
  // trip-hop / downtempo (slate blue)
  'trip-hop':            '#4a6fa5',
  'chillout':            '#5a80b8',
  'downtempo':           '#3a5f95',
  // pop (pink/rose)
  'pop':                 '#e8406a',
  'disco':               '#ff69b4',
  'twee':                '#ff8fab',
  'power pop':           '#f06080',
  'easy listening':      '#f0a0b8',
  'japanese':            '#ff7eb3',
  'korean':              '#ff9ec8',
  // world / reggae (greens)
  'reggae':              '#38b000',
  'dub':                 '#2a9030',
  'latin':               '#ff6b35',
  'african':             '#e8a020',
  'world music':         '#50b050',
  'brazilian':           '#009c3b',
  // ska (yellow-green)
  'ska':                 '#c8d600',
  // rockabilly / garage (amber)
  'rockabilly/garage':   '#ff924c',
  // industrial (steel)
  'industrial':          '#6b7280',
  // fallback
  'other':               '#666666',
};

// pie-category → hex  (broader than GENRE_COLORS; matches tag_map.json pie values)
const PIE_COLORS = {
  'indie / alternative':    '#5b8db8',
  'rock':                   '#e63946',
  'metal':                  '#2b2d42',
  'post-punk / darkwave':   '#6a4c93',
  'electronic / dance':     '#4cc9f0',
  'folk / acoustic':        '#3aad6f',
  'country':                '#d4a373',
  'punk / hardcore':        '#f77f00',
  'psychedelic':            '#c77dff',
  'ambient / experimental': '#06d6a0',
  'hip-hop':                '#f4a261',
  'jazz':                   '#e9c46a',
  'classical':              '#c8b280',
  'r&b / soul / funk':      '#dc7955',
  'new wave':               '#00b4d8',
  'shoegaze / dream pop':   '#b5a4dc',
  'trip-hop / downtempo':   '#4a6fa5',
  'pop':                    '#e8406a',
  'world / reggae':         '#38b000',
  'ska':                    '#c8d600',
  'rockabilly / garage':    '#ff924c',
  'industrial':             '#6b7280',
  'easy listening':         '#f0a0b8',
  'other':                  '#555555',
};

function pieCSSGradient(combined_pie) {
  if (!combined_pie) return null;
  const entries = Object.entries(combined_pie).filter(([, v]) => v > 0);
  if (!entries.length) return null;
  let pos = 0;
  const stops = entries.map(([genre, frac]) => {
    const color = PIE_COLORS[genre] || '#666';
    const start = (pos * 100).toFixed(1);
    pos += frac;
    return `${color} ${start}% ${(pos * 100).toFixed(1)}%`;
  });
  return `conic-gradient(${stops.join(', ')})`;
}

function genreHexFor(artistName, bar) {
  if (!profilingOn) return null;
  const colors = bar.profiling && bar.profiling.artist_colors;
  if (!colors) return null;
  const bandColor = colors[artistName];
  if (!bandColor) return null;
  return GENRE_COLORS[bandColor] || null;
}

function fgFor(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return (0.2126*r + 0.7152*g + 0.0722*b) > 0.55 ? '#111' : '#fff';
}

// ── Map init ─────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([30, 10], 3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom: 19,
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 60,
  iconCreateFunction(cluster) {
    const n = cluster.getChildCount();
    const el = document.createElement('div');
    el.className = 'jb-cluster' + (n >= 10 ? ' large' : '');
    el.textContent = n;
    const size = n >= 10 ? 46 : 38;
    return L.divIcon({ html: el, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2] });
  },
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
});
map.addLayer(clusterGroup);

// ── Panel ─────────────────────────────────────────────────────────────────────
function openPanel(bar) {
  document.getElementById('panel-name').textContent = bar.bar_name || 'Unknown bar';

  const live = bar.is_live;
  const lastSeen = bar.last_seen
    ? new Date(bar.last_seen * 1000).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })
    : '';
  const loc = bar.location ? ` · ${bar.location}` : '';
  document.getElementById('panel-meta').innerHTML = live
    ? `<span class="live-dot"></span>Live now${loc}`
    : `Last active ${lastSeen}${loc}`;

  const wrap = document.getElementById('panel-bubbles');
  const playlists = bar.playlists || [];
  if (playlists.length === 0) {
    wrap.innerHTML = '<div style="color:var(--muted);font-size:14px">No playlists listed</div>';
  } else {
    let ci = 0;
    wrap.innerHTML = playlists.map(pl => {
      const displayName = pl.display_name || pl.name;
      const notePart = pl.note ? ` <span class="playlist-line-note">(${esc(pl.note)})</span>` : '';
      const line = `<div class="playlist-line">${esc(displayName)}${notePart}</div>`;
      const bubbles = (pl.artists || []).map(artist => {
        const genre = genreHexFor(artist, bar);
        let bg, fg;
        if (genre) {
          bg = genre; fg = fgFor(bg);
        } else if (profilingOn) {
          bg = '#c8c8c8'; fg = '#333';   // profiling on but artist not yet profiled
        } else {
          bg = PALETTE[ci % PALETTE.length]; fg = fgFor(bg); ci++;
        }
        return `<div class="bubble" style="background:${bg};color:${fg}">${esc(artist)}</div>`;
      }).join('');
      return `<div class="playlist-section">${line}<div class="bubble-wrap">${bubbles}</div></div>`;
    }).join('');
  }

  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  document.getElementById('panel').classList.remove('open');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Load bars ─────────────────────────────────────────────────────────────────
async function loadBars() {
  const res  = await fetch('/api/map');
  const data = await res.json();
  const bars = data.bars || [];
  profilingOn = data.profiling_on || false;

  const mapped = bars.filter(b => b.lat != null && b.lng != null);
  const count  = mapped.length;

  document.getElementById('bar-count').textContent =
    count === 0 ? 'No bars yet' : `${count} bar${count === 1 ? '' : 's'} on the map`;

  if (count === 0) {
    document.getElementById('empty').style.display = 'block';
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => map.setView([pos.coords.latitude, pos.coords.longitude], 13),
        () => {}
      );
    }
    return;
  }

  const bounds = [];
  mapped.forEach(bar => {
    const pieGrad = profilingOn && bar.profiling && pieCSSGradient(bar.profiling.combined_pie);
    const size = pieGrad ? 52 : 28;
    const half = size / 2;

    const el = document.createElement('div');
    el.className = 'jb-marker' + (bar.is_live ? ' live' : '');
    el.style.width  = size + 'px';
    el.style.height = size + 'px';
    if (pieGrad) {
      el.style.background   = pieGrad;
      el.style.borderColor  = bar.is_live ? '#4ade80' : '#fff';
    } else {
      el.textContent = '♪';
    }

    const marker = L.marker([bar.lat, bar.lng], {
      icon: L.divIcon({ html: el, className: '', iconSize: [size, size], iconAnchor: [half, half] }),
    });
    clusterGroup.addLayer(marker);

    const tooltipHtml = bar.location
      ? `<strong>${esc(bar.bar_name)}</strong><br>${esc(bar.location)}`
      : `<strong>${esc(bar.bar_name)}</strong>`;
    marker.bindTooltip(tooltipHtml, {
      direction: 'top', offset: [0, -16], className: 'jb-tooltip', sticky: false,
    });

    marker.on('click', () => openPanel(bar));
    bounds.push([bar.lat, bar.lng]);
  });

  if (bounds.length === 1) {
    map.setView(bounds[0], 13);
  } else if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 13 });
  }
}

loadBars();

(function() {
  const COLORS = ["#fda185","#fbbe84","#ffc24a","#dc7955","#e8406a","#ffffff"];
  const el = document.getElementById('brand-name');
  let html = '', last = '';
  for (const ch of el.textContent) {
    if (ch === ' ') { html += ' '; continue; }
    const pool  = COLORS.filter(c => c !== last);
    const color = pool[Math.floor(Math.random() * pool.length)];
    last = color;
    html += `<span style="color:${color}">${ch}</span>`;
  }
  el.innerHTML = html;
})();
</script>
</body>
</html>
