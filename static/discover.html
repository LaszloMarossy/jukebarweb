<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JukeBars — Find a bar near you</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">

<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:     #111;
  --card:   #1e1e1e;
  --border: #333;
  --text:   #fff;
  --muted:  #888;
  --accent: #fda185;
  --live:   #4ade80;
}

html, body { height: 100%; background: #e8e0d8; color: var(--text); font-family: Helvetica, Arial, sans-serif; }

/* ── Header ── */
.top-bar {
  position: fixed; top: 0; left: 0; right: 0; z-index: 1000;
  background: rgba(17,17,17,.92); backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--border);
  padding: 8px 16px;
  display: flex; align-items: center; gap: 12px;
}
.brand-link {
  display: flex; flex-direction: column; gap: 2px;
  text-decoration: none; flex: 1;
}
.brand-link:hover { opacity: .85; }
.brand-main-row { display: flex; align-items: center; gap: 8px; }
.brand-name {
  font-family: 'Bubblegum Sans', cursive;
  font-size: 28px; color: var(--accent); line-height: 1;
}
.brand-sub { font-size: 13px; color: #ddd; }


/* ── Map ── */
#map { position: fixed; inset: 0; top: 70px; z-index: 0; }

/* ── Panel ── */
#panel {
  position: fixed; bottom: 0; left: 0; right: 0; z-index: 500;
  background: var(--card); border-top: 2px solid var(--accent);
  border-radius: 18px 18px 0 0;
  padding: 0 0 env(safe-area-inset-bottom);
  max-height: 65dvh; display: flex; flex-direction: column;
  transform: translateY(100%); transition: transform .3s ease;
}
#panel.open { transform: translateY(0); }

.panel-drag {
  flex-shrink: 0; text-align: center; padding: 10px 0 4px; cursor: pointer;
}
.panel-drag::before {
  content: ""; display: inline-block;
  width: 36px; height: 4px; border-radius: 2px; background: var(--border);
}

.panel-head {
  flex-shrink: 0; padding: 0 16px 10px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.panel-title-row { flex: 1; min-width: 0; }
.panel-name  { font-size: 23px; font-weight: 800; line-height: 1.35; }
.panel-bar-detail { font-size: 15px; font-weight: 400; color: #fff; }
.live-dot {
  display: inline-block; width: 8px; height: 8px;
  border-radius: 50%; background: var(--live);
  margin-right: 5px; animation: pulse 1.6s ease-in-out infinite;
}
@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: .5; transform: scale(.75); }
}
.panel-close {
  flex-shrink: 0; background: none; border: none; color: var(--muted);
  font-size: 22px; cursor: pointer; padding: 2px 4px; line-height: 1;
}

.bubble-scroll {
  flex: 1; overflow-y: auto;
  padding: 0 14px 20px;
}

/* ── Section labels (BAR PROFILE, PLAYLIST:) ── */
.section-label {
  font-weight: 300; letter-spacing: .13em;
  text-transform: uppercase; color: var(--accent);
}

#panel-profile { padding: 0 14px 10px; flex-shrink: 0; }

/* ── Bar Profile section ── */
.bar-profile { margin-bottom: 0; }

/* ── Band popup overlay ── */
#band-popup {
  display: none; position: absolute;
  left: 10px; max-width: calc(100% - 20px);
  background: #ffe14d; border: none;
  border-radius: 10px; padding: 8px 32px 8px 12px;
  z-index: 20; box-shadow: 0 4px 18px rgba(0,0,0,.5);
  font-size: 14px; line-height: 1.6; color: #1a1000;
}
.band-popup-close {
  position: absolute; top: 6px; right: 8px;
  background: none; border: none; color: #7a6000;
  font-size: 17px; cursor: pointer; padding: 0; line-height: 1;
}
.bar-profile-header { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px; margin-bottom: 16px; }
.bar-profile-title { font-size: 15px; }
.bar-profile-label { font-size: 15px; font-weight: 800; color: var(--accent); line-height: 1.3; }
.bar-profile-bar {
  display: flex; height: 28px; border-radius: 6px; overflow: hidden;
  width: calc(100% - 4px); cursor: crosshair; touch-action: none; user-select: none;
}
.playlist-section + .playlist-section {
  margin-top: 14px; padding-top: 14px;
  border-top: 1px solid var(--border);
}
.playlist-line { font-size: 15px; font-weight: 700; margin-bottom: 6px; }
.playlist-line-note { font-weight: 400; color: var(--muted); }
.bubble-wrap {
  display: flex; flex-wrap: wrap; gap: 8px;
}
.bubble {
  border-radius: 20px; padding: 7px 16px;
  font-size: 14px; font-weight: 700;
  white-space: nowrap;
}

/* ── Empty state ── */
#empty {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
  text-align: center; color: var(--muted); z-index: 100; pointer-events: none;
  display: none;
  background: rgba(30,30,30,.88); border: 1px solid var(--border);
  border-radius: 14px; padding: 24px 32px;
}
#empty h2 { font-size: 20px; color: var(--text); margin-bottom: 8px; }

/* ── Leaflet tooltip ── */
.jb-tooltip {
  background: rgba(30,30,30,.95); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 10px;
  color: var(--text); font-family: Helvetica, Arial, sans-serif;
  font-size: 13px; line-height: 1.4; box-shadow: 0 2px 8px rgba(0,0,0,.3);
  white-space: nowrap;
}
.jb-tooltip::before { display: none; }
.jb-tooltip strong { color: var(--accent); }

/* ── Leaflet marker overrides ── */
.jb-marker {
  width: 28px; height: 28px; border-radius: 50%;
  border: 3px solid #fff; background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.5);
  cursor: pointer;
}
.jb-marker.live { background: var(--live); border-color: #fff; }

/* ── Cluster markers ── */
.jb-cluster {
  width: 38px; height: 38px; border-radius: 50%;
  background: var(--accent); border: 3px solid #fff;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800; color: #111;
  box-shadow: 0 2px 10px rgba(0,0,0,.55); cursor: pointer;
}
.jb-cluster.large { width: 46px; height: 46px; font-size: 15px; }
</style>
</head>

<script>
// Set from /api/map response. When true, use genre colors; grey for unprofiled artists.
let profilingOn = false;
let currentBar = null;

// Rotating palette used when profiling is off

// band_color string → hex  (matches values in tag_map.json)

  'psychedelic':         '#c77dff',
  'space / atmospheric': '#9966cc',
  // ambient / experimental (teals)
  'ambient':             '#06d6a0',
  'experimental':        '#00b890',
  'dark ambient':        '#0a8060',
  'avant-garde':         '#20c090',
  'noise':               '#008060',
  'new age':             '#40e0c0',
  'drone / ambient rock':'#30c0a0',

  // hip-hop (ambers)

// pie-category → hex  (broader than GENRE_COLORS; matches tag_map.json pie values)
const PIE_COLORS = {
  'indie / alternative':    '#5b8db8',
  'rock':                   '#e63946',
  'metal':                  '#2b2d42',
  'post-punk / darkwave':   '#6a4c93',
  'electronic / dance':     '#4cc9f0',
  'folk / acoustic':        '#3aad6f',
  'country':                '#d4a373',
  'punk / hardcore':        '#f77f00',
  'psychedelic':            '#c77dff',
  'ambient / experimental': '#06d6a0',
  'hip-hop':                '#f4a261',
  'jazz':                   '#e9c46a',
  'classical':              '#c8b280',
  'r&b / soul / funk':      '#dc7955',
  'new wave':               '#00b4d8',
  'shoegaze / dream pop':   '#b5a4dc',
  'trip-hop / downtempo':   '#4a6fa5',
  'pop':                    '#e8406a',
  'world / reggae':         '#38b000',
  'ska':                    '#c8d600',
  'rockabilly / garage':    '#ff924c',
  'industrial':             '#6b7280',
  'easy listening':         '#f0a0b8',
  'other':                  '#555555',
};

// Single color lookup used by pie chart, profile bar, and band bubbles.
// Checks PIE_COLORS first (compound keys), falls back to GENRE_COLORS (simple keys).
function genreColor(key) {
  return PIE_COLORS[key] || GENRE_COLORS[key] || '#666';
}

function pieSVG(combined_pie, size, isLive) {
  if (!combined_pie) return null;
  const entries = Object.entries(combined_pie).filter(([, v]) => v > 0);
  if (!entries.length) return null;
  const r  = (size - 6) / 2;
  const cx = size / 2, cy = size / 2;
  let angle = -Math.PI / 2;
  const paths = [];
  for (const [genre, frac] of entries) {
    const color = genreColor(genre);
    const pct   = Math.round(frac * 100);
    if (frac >= 0.9999) {
      paths.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="${color}"><title>${genre} ${pct}%</title></circle>`);
    } else {
      const a0 = angle;
      angle += frac * 2 * Math.PI;
      const x1 = (cx + r * Math.cos(a0)).toFixed(1);
      const y1 = (cy + r * Math.sin(a0)).toFixed(1);
      const x2 = (cx + r * Math.cos(angle)).toFixed(1);
      const y2 = (cy + r * Math.sin(angle)).toFixed(1);
      const lg = frac > 0.5 ? 1 : 0;
      paths.push(`<path d="M${cx},${cy}L${x1},${y1}A${r},${r} 0 ${lg},1 ${x2},${y2}Z" fill="${color}"><title>${genre} ${pct}%</title></path>`);
    }
  }
  const ring = isLive ? '#4ade80' : '#fff';
  paths.push(`<circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${ring}" stroke-width="3" pointer-events="none"/>`);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" style="display:block;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5));cursor:pointer">${paths.join('')}</svg>`;
}

function genreHexFor(artistName, bar) {
  if (!profilingOn) return null;
  const colors = bar.profiling && bar.profiling.artist_colors;
  if (!colors) return null;
  const bandColor = colors[artistName];
  if (!bandColor) return null;
  return genreColor(bandColor) || null;
}

function fgFor(hex) {
  const r = parseInt(hex.slice(1,3),16)/255;
  const g = parseInt(hex.slice(3,5),16)/255;
  const b = parseInt(hex.slice(5,7),16)/255;
  return (0.2126*r + 0.7152*g + 0.0722*b) > 0.55 ? '#111' : '#fff';
}

// ── Map init ─────────────────────────────────────────────────────────────────
const map = L.map('map', { zoomControl: false }).setView([30, 10], 3);
L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors &copy; <a href="https://carto.com/attributions">CARTO</a>',
  maxZoom: 19,
}).addTo(map);
L.control.zoom({ position: 'bottomright' }).addTo(map);

const clusterGroup = L.markerClusterGroup({
  maxClusterRadius: 60,
  iconCreateFunction(cluster) {
    const n = cluster.getChildCount();
    const el = document.createElement('div');
    el.className = 'jb-cluster' + (n >= 10 ? ' large' : '');
    el.textContent = n;
    const size = n >= 10 ? 46 : 38;
    return L.divIcon({ html: el, className: '', iconSize: [size, size], iconAnchor: [size/2, size/2] });
  },
  spiderfyOnMaxZoom: true,
  showCoverageOnHover: false,
  zoomToBoundsOnClick: true,
});
map.addLayer(clusterGroup);

// ── Panel ─────────────────────────────────────────────────────────────────────
function showBandDetail(artist, triggerEl) {
  if (!currentBar) return;
  const profiling = currentBar.profiling || {};
  const tags  = profiling.artist_tags   && profiling.artist_tags[artist];
  const color = profiling.artist_colors && profiling.artist_colors[artist];

  const genreSpan = color
    ? ` <span style="color:#9b5000;font-weight:600">${esc(color)}</span>` : '';
  const tagsSpan = (tags && tags.length)
    ? ` <span style="color:#5a4400">(${tags.map(([t, s]) =>
        `${esc(t)} <span style="color:#c07000;font-weight:700">${s}</span>`
      ).join(', ')})</span>`
    : '';
  document.getElementById('popup-content').innerHTML =
    `<strong>${esc(artist)}</strong>${genreSpan}${tagsSpan}`;

  const popup = document.getElementById('band-popup');
  popup.style.top = 'auto';
  popup.style.bottom = 'auto';
  popup.style.display = 'block';

  const panelRect = document.getElementById('panel').getBoundingClientRect();
  const trigRect  = triggerEl.getBoundingClientRect();
  const relTop    = trigRect.top - panelRect.top;
  const popupH    = popup.offsetHeight;
  const spaceBelow = panelRect.height - relTop - trigRect.height;

  if (spaceBelow >= popupH + 8 || spaceBelow >= relTop) {
    popup.style.top = (relTop + trigRect.height + 6) + 'px';
  } else {
    popup.style.top = Math.max(4, relTop - popupH - 6) + 'px';
  }
}

function closeBandPopup() {
  document.getElementById('band-popup').style.display = 'none';
}

function openPanel(bar) {
  currentBar = bar;
  const live = bar.is_live;
  const lastSeen = bar.last_seen
    ? new Date(bar.last_seen * 1000).toLocaleDateString([], { month: 'short', day: 'numeric', year: 'numeric' })
    : '';
  let detail = '';
  if (bar.location) detail += ` — ${esc(bar.location)}`;
  if (live) detail += ` &nbsp;<span class="live-dot"></span>Live`;
  else if (lastSeen) detail += ` (last active: ${lastSeen})`;
  document.getElementById('panel-name').innerHTML =
    `<span>${esc(bar.bar_name || 'Unknown bar')}</span>` +
    (detail ? `<span class="panel-bar-detail">${detail}</span>` : '');

  // ── Bar Profile bar ──
  const profileSlot = document.getElementById('panel-profile');
  const pie = profilingOn && bar.profiling && bar.profiling.combined_pie;
  if (pie && Object.keys(pie).length) {
    const segments = Object.entries(pie)
      .filter(([, v]) => v > 0)
      .sort(([a], [b]) => a === 'other' ? 1 : b === 'other' ? -1 : 0)
      .map(([genre, frac]) => {
        const color = genreColor(genre);
        return `<div style="width:${(frac*100).toFixed(2)}%;background:${color};height:100%" data-genre="${esc(genre)}" data-w="${frac}"></div>`;
      }).join('');
    profileSlot.innerHTML = `
      <div class="bar-profile">
        <div class="bar-profile-header">
          <span class="section-label bar-profile-title">Profile:</span>
          <span class="bar-profile-label" id="profile-label"></span>
        </div>
        <div class="bar-profile-bar" id="profile-bar">${segments}</div>
      </div>`;

    const barEl   = document.getElementById('profile-bar');
    const labelEl = document.getElementById('profile-label');

    function showGenreAt(clientX) {
      const rect = barEl.getBoundingClientRect();
      const x = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
      let cum = 0;
      for (const seg of barEl.children) {
        cum += parseFloat(seg.dataset.w);
        if (x <= cum + 0.001) { labelEl.textContent = seg.dataset.genre; return; }
      }
      labelEl.textContent = barEl.lastElementChild?.dataset.genre || '';
    }

    barEl.addEventListener('pointermove', e => showGenreAt(e.clientX));
    barEl.addEventListener('pointerdown', e => { showGenreAt(e.clientX); e.preventDefault(); });
    barEl.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') labelEl.textContent = ''; });
  } else {
    profileSlot.innerHTML = '';
  }

  // ── Playlists + bubbles ──
  const wrap = document.getElementById('panel-bubbles');
  const playlists = bar.playlists || [];
  if (playlists.length === 0) {
    wrap.innerHTML = '<div style="color:var(--muted);font-size:14px">No playlists listed</div>';
  } else {
    let ci = 0;
    wrap.innerHTML = playlists.map(pl => {
      const displayName = pl.display_name || pl.name;
      const notePart = pl.note ? ` <span class="playlist-line-note">(${esc(pl.note)})</span>` : '';
      const line = `<div class="playlist-line"><span class="section-label">Playlist: </span>${esc(displayName)}${notePart}</div>`;
      const bubbles = (pl.artists || []).slice().sort((a, b) => {
        const ka = a.replace(/^the\s+/i, '').toLowerCase();
        const kb = b.replace(/^the\s+/i, '').toLowerCase();
        return ka.localeCompare(kb);
      }).map(artist => {
        const bandColor = profilingOn && bar.profiling && bar.profiling.artist_colors && bar.profiling.artist_colors[artist];
        const hex = bandColor ? (genreColor(bandColor) || null) : null;
        let bg, fg;
        if (hex) {
          bg = hex; fg = fgFor(bg);
        } else if (profilingOn) {
          bg = '#c8c8c8'; fg = '#333';
        } else {
          bg = PALETTE[ci % PALETTE.length]; fg = fgFor(bg); ci++;
        }
        return `<div class="bubble" style="background:${bg};color:${fg}" data-artist="${esc(artist)}">${esc(artist)}</div>`;
      }).join('');
      return `<div class="playlist-section">${line}<div class="bubble-wrap">${bubbles}</div></div>`;
    }).join('');
  }

  closeBandPopup();
  document.getElementById('panel').classList.add('open');
}

function closePanel() {
  closeBandPopup();
  document.getElementById('panel').classList.remove('open');
}

function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

document.getElementById('panel-bubbles').addEventListener('click', e => {
  const b = e.target.closest('.bubble');
  if (b) showBandDetail(b.dataset.artist, b);
});

// ── Load bars ─────────────────────────────────────────────────────────────────
async function loadBars() {
  const res  = await fetch('/api/map');
  const data = await res.json();
  const bars = data.bars || [];
  profilingOn = data.profiling_on || false;

  const mapped = bars.filter(b => b.lat != null && b.lng != null);
  const count  = mapped.length;

  if (count === 0) {
    document.getElementById('empty').style.display = 'block';
    if (navigator.geolocation) {
      navigator.geolocation.getCurrentPosition(
        pos => map.setView([pos.coords.latitude, pos.coords.longitude], 13),
        () => {}
      );
    }
    return;
  }

  const bounds = [];
  mapped.forEach(bar => {
    const pieSvg = profilingOn && bar.profiling && pieSVG(bar.profiling.combined_pie, 52, bar.is_live);
    const size = pieSvg ? 52 : 28;
    const half = size / 2;

    const el = document.createElement('div');
    if (pieSvg) {
      el.style.cssText = `width:${size}px;height:${size}px`;
      el.innerHTML = pieSvg;
    } else {
      el.className = 'jb-marker' + (bar.is_live ? ' live' : '');
      el.textContent = '♪';
    }

    const marker = L.marker([bar.lat, bar.lng], {
      icon: L.divIcon({ html: el, className: '', iconSize: [size, size], iconAnchor: [half, half] }),
    });
    clusterGroup.addLayer(marker);

    const tooltipHtml = bar.location
      ? `<strong>${esc(bar.bar_name)}</strong><br>${esc(bar.location)}`
      : `<strong>${esc(bar.bar_name)}</strong>`;
    marker.bindTooltip(tooltipHtml, {
      direction: 'top', offset: [0, -16], className: 'jb-tooltip', sticky: false,
    });

    marker.on('click', () => openPanel(bar));
    bounds.push([bar.lat, bar.lng]);
  });

  if (bounds.length === 1) {
    map.setView(bounds[0], 13);
  } else if (bounds.length > 1) {
    map.fitBounds(bounds, { padding: [60, 60], maxZoom: 13 });
  }
}

loadBars();

(function() {
  const COLORS = ["#fda185","#fbbe84","#ffc24a","#dc7955","#e8406a","#ffffff"];
  const el = document.getElementById('brand-name');
  let html = '', last = '';
  for (const ch of el.textContent) {
    if (ch === ' ') { html += ' '; continue; }
    const pool  = COLORS.filter(c => c !== last);
    const color = pool[Math.floor(Math.random() * pool.length)];
    last = color;
    html += `<span style="color:${color}">${ch}</span>`;
  }
  el.innerHTML = html;
})();
</script>
