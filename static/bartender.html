<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bubblegum+Sans&display=swap" rel="stylesheet">
  <title>JukeBar — Bartender</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #111;
      --card:    #1a1a1a;
      --card2:   #222;
      --accent:  #fda185;
      --text:    #f0ece8;
      --muted:   #888;
      --border:  #2a2a2a;
      --green:   #4ade80;
      --red:     #f87171;
    }

    html, body {
      background: var(--bg); color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, sans-serif;
      min-height: 100dvh; -webkit-font-smoothing: antialiased;
    }
    button { cursor: pointer; border: none; font: inherit; }

    /* ── spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      width: 32px; height: 32px; border: 3px solid var(--border);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin .8s linear infinite; margin: 0 auto;
    }

    /* ── screens ── */
    .screen { display: none; }
    .screen.active { display: block; }

    /* ── error ── */
    #s-error { padding: 60px 24px; text-align: center; }
    .err-title { font-size: 20px; font-weight: 700; margin-bottom: 10px; }
    .err-msg { color: var(--muted); font-size: 15px; line-height: 1.6; }

    /* ── PIN gate ── */
    #s-pin {
      min-height: 100dvh; display: none;
      flex-direction: column; align-items: center; justify-content: flex-start;
      padding: 60px 24px 40px; gap: 24px; text-align: center;
    }
    #s-pin.active { display: flex; }
    .pin-logo { margin-bottom: 4px; }
    .pin-title { font-size: 20px; font-weight: 700; }
    .pin-sub   { font-size: 14px; color: var(--muted); margin-top: -12px; }
    .pin-field {
      width: 100%; max-width: 220px;
      background: var(--card); border: 1px solid var(--border); border-radius: 12px;
      color: var(--text); font-size: 28px; font-weight: 700; letter-spacing: 8px;
      text-align: center; padding: 14px 16px;
      -webkit-text-security: disc;
    }
    .pin-field:focus { outline: none; border-color: var(--accent); }
    .pin-btn {
      width: 100%; max-width: 220px;
      background: var(--accent); color: #000; font-weight: 800; font-size: 16px;
      padding: 14px; border-radius: 12px; transition: opacity .15s;
    }
    .pin-btn:active { opacity: .8; }
    .pin-btn:disabled { opacity: .4; pointer-events: none; }
    .pin-err { font-size: 14px; color: var(--red); min-height: 20px; }

    /* ── main layout ── */
    #s-main { max-width: 640px; margin: 0 auto; padding: 0 16px 60px; }

    /* ── header ── */
    .header {
      display: flex; align-items: center; gap: 10px;
      padding: 16px 0 12px; border-bottom: 1px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 10;
    }
    .header svg { flex-shrink: 0; }
    .header-info { flex: 1; min-width: 0; }
    .bar-name {
      font-family: 'Bubblegum Sans', cursive;
      font-size: clamp(18px, 4dvh, 32px); line-height: 1.1;
    }
    .header-role {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--accent); margin-top: 1px;
    }
    .refresh-badge {
      font-size: 11px; color: var(--muted); white-space: nowrap;
    }

    /* ── now playing ── */
    .now-playing-card {
      margin: 16px 0 20px;
      background: var(--card); border-radius: 14px;
      padding: 14px 16px; border: 1px solid var(--border);
    }
    .np-label {
      font-size: 10px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--muted); margin-bottom: 6px;
    }
    .np-track { font-size: 17px; font-weight: 700; color: var(--accent); }
    .np-artist { font-size: 13px; color: var(--muted); margin-top: 2px; }
    .np-idle { font-size: 14px; color: var(--muted); }

    /* ── section title ── */
    .section-title {
      font-family: 'Bubblegum Sans', cursive;
      font-size: 14px; letter-spacing: 1.5px; text-transform: uppercase;
      color: rgba(255,255,255,.6); margin-bottom: 10px; margin-top: 4px;
    }
    .empty-state {
      text-align: center; color: var(--muted);
      padding: 32px 16px; font-size: 14px;
      background: var(--card); border-radius: 14px;
      border: 1px solid var(--border);
    }

    /* ── request card ── */
    .req-card { background: var(--card); border-radius: 10px; padding: 9px 12px; margin-bottom: 7px; border: 1px solid var(--border); }
    .req-card.approved { border-left: 3px solid #166534; }

    .req-row1 { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .req-name  { font-size: 26px; font-weight: 700; color: var(--text); }
    .req-price { font-size: 22px; font-weight: 700; color: #a78bfa; white-space: nowrap; }
    .req-acts  { display: flex; gap: 8px; align-items: center; }
    .btn-act   { border: none; border-radius: 6px; padding: 8px 20px; font-size: 15px; font-weight: 800; cursor: pointer; transition: opacity .15s; }
    .btn-act:active { opacity: .7; }
    .btn-approve { background: #166534; color: #4ade80; padding: 8px 44px; }
    .btn-jump    { background: #713f12; color: #fde047; }
    .btn-deny    { background: #7f1d1d; color: #f87171; }
    .req-badge { display: inline-block; padding: 2px 7px; border-radius: 5px; font-size: 11px; font-weight: 700; }
    .req-badge.approved { background: #166534; color: #4ade80; }
    .req-time   { font-size: 10px; color: var(--muted); white-space: nowrap; }
    .req-device { font-size: 11px; color: var(--text); font-weight: 600; white-space: nowrap; margin-left: auto; }

    .song-rows { margin-top: 5px; display: flex; flex-direction: column; gap: 2px; }
    .song-row  { display: grid; grid-template-columns: 15ch 10ch 1fr; gap: 6px; font-size: 12px; overflow: hidden; }
    .song-col  { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .song-artist { color: rgba(255,255,255,.75); }
    .song-album  { color: var(--muted); }
    .song-title  { color: rgba(255,255,255,.5); }

    .btn-disabled { opacity: .35; pointer-events: none; }

    .section-gap { margin-top: 28px; }

    /* ── loading overlay ── */
    #s-loading {
      position: fixed; inset: 0; display: flex;
      flex-direction: column; align-items: center; justify-content: center;
      gap: 16px; background: var(--bg);
    }
    .load-text { color: var(--muted); font-size: 14px; }
  </style>
</head>
<body>

<div id="s-loading">
  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="56" height="56">
    <circle cx="36" cy="36" r="34" fill="#fbbe84"/>
    <circle cx="36" cy="36" r="29" fill="#ffffff"/>
    <circle cx="36" cy="36" r="24" fill="#fda185"/>
    <line x1="36" y1="36" x2="36" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="53" y2="19" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="60" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="53" y2="53" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="36" y2="60" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="19" y2="53" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="12" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="36" y1="36" x2="19" y2="19" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
    <circle cx="36" cy="36" r="4" fill="#ffffff"/>
  </svg>
  <div class="spinner"></div>
  <div class="load-text">Connecting…</div>
</div>

<div id="s-error" class="screen">
  <div class="err-title" id="err-title">Unavailable</div>
  <div class="err-msg"   id="err-msg">Something went wrong.</div>
</div>

<!-- ── PIN gate ─────────────────────────────────────────────────────────── -->
<div id="s-pin" class="screen">
  <div class="pin-logo">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="64" height="64">
      <circle cx="36" cy="36" r="34" fill="#fbbe84"/>
      <circle cx="36" cy="36" r="29" fill="#ffffff"/>
      <circle cx="36" cy="36" r="24" fill="#fda185"/>
      <line x1="36" y1="36" x2="36" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="53" y2="19" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="60" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="53" y2="53" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="36" y2="60" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="19" y2="53" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="12" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="19" y2="19" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="36" cy="36" r="4" fill="#ffffff"/>
    </svg>
  </div>
  <div class="pin-title">Bartender Access</div>
  <div class="pin-sub">Enter the admin PIN to continue</div>
  <input class="pin-field" id="pin-input" type="tel" inputmode="numeric"
         maxlength="6" placeholder="••••" autocomplete="off"
         oninput="onPinInput()" onkeydown="if(event.key==='Enter') verifyPin()">
  <div class="pin-err" id="pin-err"></div>
  <button class="pin-btn" id="pin-btn" onclick="verifyPin()" disabled>Enter</button>
</div>

<div id="s-main" class="screen">
  <div class="header">
    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72" width="40" height="40">
      <circle cx="36" cy="36" r="34" fill="#fbbe84"/>
      <circle cx="36" cy="36" r="29" fill="#ffffff"/>
      <circle cx="36" cy="36" r="24" fill="#fda185"/>
      <line x1="36" y1="36" x2="36" y2="12" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="53" y2="19" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="60" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="53" y2="53" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="36" y2="60" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="19" y2="53" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="12" y2="36" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <line x1="36" y1="36" x2="19" y2="19" stroke="white" stroke-width="1.8" stroke-linecap="round"/>
      <circle cx="36" cy="36" r="4" fill="#ffffff"/>
    </svg>
    <div class="header-info">
      <div class="bar-name" id="bar-name">JukeBar</div>
      <div class="header-role">Bartender</div>
    </div>
    <div class="refresh-badge" id="refresh-badge"></div>
  </div>

  <div class="now-playing-card">
    <div class="np-label">Now Playing</div>
    <div id="now-playing"><div class="np-idle">Nothing playing</div></div>
  </div>

  <div id="pending-section">
    <div class="section-title">Requests</div>
    <div id="pending-list"></div>
  </div>

  <div id="upnext-section" class="section-gap" style="display:none">
    <div class="section-title">Up Next</div>
    <div id="upnext-list"></div>
  </div>
</div>

<script>
const S = { jukebarId: '', session: '', barName: '', pollTimer: null, pricePerSong: 0, priceForThree: 0, currency: '' };

// ── Boot ───────────────────────────────────────────────────────────────────
async function boot() {
  const parts = location.pathname.split('/').filter(Boolean);
  S.jukebarId = parts[parts.length - 1];
  S.session   = new URLSearchParams(location.search).get('s') || '';

  if (!S.jukebarId || !S.session)
    return showError('Invalid link', 'Please get the bartender QR code from the JukeBar admin panel.');

  // Check for cached auth in sessionStorage (valid until tab is closed or session rotates)
  const authKey = `jb_auth_${S.jukebarId}_${S.session}`;
  $('s-loading').style.display = 'none';
  if (sessionStorage.getItem(authKey) === 'ok') {
    await startMain();
  } else {
    showScreen('s-pin');
    $('pin-input').focus();
  }
}

// ── PIN gate ────────────────────────────────────────────────────────────────
function onPinInput() {
  const val = $('pin-input').value.replace(/\D/g, '');
  $('pin-input').value = val;
  $('pin-btn').disabled = val.length < 4;
  $('pin-err').textContent = '';
}

async function sha256hex(text) {
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

async function verifyPin() {
  const pin = $('pin-input').value.trim();
  if (pin.length < 4) return;
  $('pin-btn').disabled = true;
  $('pin-err').textContent = '';

  try {
    const hash = await sha256hex(pin);
    const res  = await fetch(`/api/bar/${S.jukebarId}/authenticate?s=${enc(S.session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ pin_hash: hash }),
    });
    if (res.status === 403) {
      $('pin-err').textContent = 'Incorrect PIN — try again.';
      $('pin-input').value = '';
      $('pin-btn').disabled = true;
      $('pin-input').focus();
      return;
    }
    if (res.status === 404) return showError('Session ended or bar offline', 'This session is no longer active, or the JukeBar is temporarily unreachable. Ask the host to start a new session and/or scan the fresh QR code.');
    if (!res.ok) throw new Error(res.status);

    // Cache so they don't have to re-enter on refresh (cleared when tab closes)
    sessionStorage.setItem(`jb_auth_${S.jukebarId}_${S.session}`, 'ok');
    await startMain();
  } catch {
    $('pin-err').textContent = 'Connection error — check your internet.';
    $('pin-btn').disabled = false;
  }
}

async function startMain() {
  await Promise.all([poll(), fetchNowPlaying()]);
  showScreen('s-main');
  S.pollTimer = setInterval(poll, 5000);
  setInterval(fetchNowPlaying, 5000);
}

// ── Poll (requests + approval queue) ────────────────────────────────────────
async function poll() {
  try {
    const res = await fetch(`/api/bar/${S.jukebarId}/requests?s=${enc(S.session)}`);
    if (res.status === 403) return showError('Session expired', 'The session has expired — ask the host to rescan the QR code.');
    if (res.status === 404) return showError('Session ended or bar offline', 'This session is no longer active, or the JukeBar is temporarily unreachable. Ask the host to start a new session and/or scan the fresh QR code.');
    if (!res.ok) return;
    const d = await res.json();

    if (d.bar_name && !S.barName) {
      S.barName = d.bar_name;
      $('bar-name').textContent = `JukeBar ${d.bar_name}`;
      document.title = `Bartender — ${d.bar_name}`;
    }

    S.pricePerSong  = d.price_per_song  || 0;
    S.priceForThree = d.price_for_three || 0;
    S.currency      = d.currency        || '';
    renderRequests(d.requests || []);
    $('refresh-badge').textContent = `Updated ${new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}`;
  } catch {}
}

// ── Now playing (polled separately — relay syncs this from iOS every 5 s) ──
async function fetchNowPlaying() {
  try {
    const res = await fetch(`/api/bar/${S.jukebarId}/nowplaying?s=${enc(S.session)}`);
    if (!res.ok) return;
    const { now_playing } = await res.json();
    renderNowPlaying(now_playing);
  } catch {}
}

// ── Render now playing ────────────────────────────────────────────────────
function renderNowPlaying(song) {
  $('now-playing').innerHTML = song
    ? `<div class="np-track">${esc(song.title || '')}</div><div class="np-artist">${esc(song.artist || '')}</div>`
    : `<div class="np-idle">Nothing playing</div>`;
}

// ── Render requests ────────────────────────────────────────────────────────
function renderRequests(requests) {
  const pending  = requests.filter(r => r.status === 'pending');
  const approved = requests.filter(r => r.status === 'approved');

  // Pending
  if (pending.length) {
    $('pending-list').innerHTML = pending.map(r => requestCard(r, true)).join('');
  } else {
    $('pending-list').innerHTML = '<div class="empty-state">No pending requests</div>';
  }

  // Approved / up next
  const unEl = $('upnext-section');
  if (approved.length) {
    $('upnext-list').innerHTML = approved.map(r => requestCard(r, false)).join('');
    unEl.style.display = '';
  } else {
    unEl.style.display = 'none';
  }
}

function deviceLabel(id) {
  if (!id) return '';
  if (id === 'HOST') return 'HOST';
  return id.slice(0, 6);
}

function requestCard(r, showActions) {
  const time  = r.created_at ? new Date(r.created_at * 1000).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
  const devId = deviceLabel(r.customer_id);
  const count = (r.song_ids || r.song_details || []).length || 1;
  const price = S.pricePerSong > 0
    ? (count === 3 && S.priceForThree > 0 ? S.priceForThree : S.pricePerSong * count)
    : 0;
  const priceHtml = price > 0 ? `<span class="req-price">${S.currency}${price.toFixed(2)}</span>` : '';
  const acts = showActions
    ? `<span class="req-acts">
        <button class="btn-act btn-approve" onclick="approve('${esc(r.id)}',false)">✓</button>
        <button class="btn-act btn-jump"    onclick="approve('${esc(r.id)}',true)">Play next</button>
        <button class="btn-act btn-deny"    onclick="deny('${esc(r.id)}')">✗</button>
       </span>`
    : `<span class="req-badge approved">In queue</span>`;
  const songRows = (r.song_details || []).map(s =>
    `<div class="song-row">
      <span class="song-col song-artist">${esc(s.artist)}</span>
      <span class="song-col song-album">${esc(s.album)}</span>
      <span class="song-col song-title">${esc(s.title)}</span>
    </div>`
  ).join('') || (r.song_titles || []).map(t =>
    `<div class="song-row"><span class="song-col song-artist" style="grid-column:1/-1">${esc(t)}</span></div>`
  ).join('');
  return `<div class="req-card ${r.status}" id="req-${esc(r.id)}">
  <div class="req-row1">
    <span class="req-name">${esc(r.requester_name || 'Guest')}</span>
    ${priceHtml}${acts}
    ${devId ? `<span class="req-device">(${esc(devId)})</span>` : ''}
    ${time ? `<span class="req-time">${time}</span>` : ''}
  </div>
  <div class="song-rows">${songRows}</div>
</div>`;
}

// ── Actions ────────────────────────────────────────────────────────────────
async function approve(requestId, jump) {
  disableCard(requestId);
  try {
    await fetch(`/api/bar/${S.jukebarId}/approve?s=${enc(S.session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request_id: requestId, jump }),
    });
  } catch {}
  await poll();
}

async function deny(requestId) {
  disableCard(requestId);
  try {
    await fetch(`/api/bar/${S.jukebarId}/deny?s=${enc(S.session)}`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ request_id: requestId }),
    });
  } catch {}
  await poll();
}

function disableCard(requestId) {
  const card = $(`req-${requestId}`);
  if (card) card.querySelectorAll('button').forEach(b => b.classList.add('btn-disabled'));
}

// ── Utilities ──────────────────────────────────────────────────────────────
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id)?.classList.add('active');
}
function showError(title, msg) {
  const el = $('s-loading');
  if (el) el.style.display = 'none';
  $('err-title').textContent = title;
  $('err-msg').textContent   = msg;
  showScreen('s-error');
}
function $(id)    { return document.getElementById(id); }
function enc(s)   { return encodeURIComponent(s || ''); }
function esc(str) { return (str || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
