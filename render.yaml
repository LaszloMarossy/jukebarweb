services:
  - type: web
    name: jukebar
    env: python
    pythonVersion: "3.11"
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATA_DIR
        value: /data
    disk:
      name: jukebar-data
      mountPath: /data
      sizeGB: 1
